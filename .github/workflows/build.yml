name: Build APK & Live Update Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Zip Bundle
        run: |
          mkdir -p www
          cp index.html www/index.html || true
          cd www && zip -r ../dist.zip ./* && cd ..

      - name: Install Dependencies & Sync
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capgo/capacitor-updater
          npx @capacitor/cli sync android

      - name: Build Android APK
        run: |
          cd android
          chmod -R 777 .
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polung-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release for Live Update
        uses: softprops/action-gh-release@v1
        with:
          files: dist.zip
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
